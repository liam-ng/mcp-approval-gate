# ServiceAccount for the aws-api-mcp-server workload (the SigV4 agent
# identity referenced throughout docs/agent-contract.md as "the agent" /
# "the executor"). Runs in the gate's own namespace so
# deploy/k8s/istio-authorizationpolicy.yaml's `app: aws-api-mcp-server`
# selector and NetworkPolicy apply to it — label the Deployment/Pod
# accordingly.
#
# The role-arn annotation must match deploy/iam/agent-executor-trust-policy.json's
# `sub` condition exactly (system:serviceaccount:mcp-approval-gate:aws-api-mcp-server)
# and the role name must match ALLOWED_AGENT_ARNS / MCP_EXECUTOR_ARN in
# deploy/k8s/configmap.yaml and the principal in deploy/scp/deny-ec2-mutations-except-gate.json.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-api-mcp-server
  namespace: mcp-approval-gate
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/mcp-approval-gate-executor
