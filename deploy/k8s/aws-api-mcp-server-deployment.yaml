# The upstream AWS API MCP server and the ticket executor, deliberately in ONE
# pod with two containers.
#
# Why one pod: both need the *same* AWS identity. The executor signs its
# X-Gate-Identity envelope as the role in ALLOWED_AGENT_ARNS / MCP_EXECUTOR_ARN,
# and agent-serviceaccount.yaml already declares `aws-api-mcp-server` to be that
# identity, with deploy/iam/agent-executor-trust-policy.json binding the role to
# exactly `system:serviceaccount:mcp-approval-gate:aws-api-mcp-server`. Sharing
# the ServiceAccount is what makes the executor's verified ARN come out right.
# Co-locating also means istio-authorizationpolicy.yaml needs no change: it
# still says "only the gate may reach aws-api-mcp-server from outside", and the
# executor never crosses the network to reach its sibling.
#
# NOTE this cannot run on the liam-dev cluster: IRSA needs a real EKS OIDC
# provider, and without credentials the executor's first identity_header() call
# raises at startup rather than silently polling as nobody.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aws-api-mcp-server
  namespace: mcp-approval-gate
  labels:
    app: aws-api-mcp-server
spec:
  # Single replica: the executor has no distributed lock. See executor/app/main.py.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aws-api-mcp-server
  template:
    metadata:
      labels:
        # This exact label is what istio-authorizationpolicy.yaml's
        # AuthorizationPolicy selector and NetworkPolicy podSelector match on.
        app: aws-api-mcp-server
    spec:
      serviceAccountName: aws-api-mcp-server
      containers:
        # --- the tool surface an IDE agent explores AWS with -----------------
        # Network-isolated so it cannot be driven directly to bypass the gate.
        # It is NOT in the execution path -- see executor/app/aws_exec.py for
        # why the executor calls botocore instead of round-tripping the
        # approved parameters through this server's CLI-string tool.
        - name: aws-api-mcp-server
          image: public.ecr.aws/awslabs-mcp/awslabs/aws-api-mcp-server:latest
          # Pin this before production: `latest` on a component that holds the
          # only role allowed to mutate EC2 is a supply-chain footgun.
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: mcp
          env:
            - name: AWS_REGION
              value: ap-east-1
            # Confirm the flag names against the image's own docs before
            # relying on them; they gate whether this server may mutate at all.
            - name: READ_OPERATIONS_ONLY
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        # --- the ticket executor ---------------------------------------------
        - name: executor
          image: REGISTRY/mcp-approval-gate-executor:latest # set by CI
          imagePullPolicy: Always
          env:
            - name: GATE_BASE_URL
              value: http://mcp-approval-gate-backend
            # Read from the gate's own ConfigMap rather than duplicated here:
            # a mismatch makes every request fail signature verification, and
            # that is a miserable thing to debug from two copies of a string.
            - name: GATE_SERVER_ID
              valueFrom:
                configMapKeyRef:
                  name: mcp-approval-gate-backend
                  key: GATE_SERVER_ID
            - name: STS_REGION
              value: us-east-1
            # Poll cadence (executor/app/settings.py). Worst-case latency from
            # "approved" to "executing" is INTERVAL + JITTER, so these are the
            # only knobs that trade approval-to-execution lag against load on
            # the gate. Jitter exists for a multi-replica future the executor
            # does not have yet -- 0 is fine at one replica.
            - name: POLL_INTERVAL_SECONDS
              value: "20"
            - name: POLL_JITTER_SECONDS
              value: "5"
            # Flip to "false" to arm it. Left on so that applying this manifest
            # cannot, by itself, mutate anything.
            - name: DRY_RUN
              value: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
---
# Only the gate's ServiceAccount may open a connection here -- enforced by
# istio-authorizationpolicy.yaml, not by this Service.
apiVersion: v1
kind: Service
metadata:
  name: aws-api-mcp-server
  namespace: mcp-approval-gate
spec:
  selector:
    app: aws-api-mcp-server
  ports:
    - port: 80
      targetPort: mcp
