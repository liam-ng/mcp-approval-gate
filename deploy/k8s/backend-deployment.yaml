apiVersion: apps/v1
kind: Deployment
metadata:
  # Object name only -- this is what pod names are derived from. The `app` label
  # below stays bare on purpose; see the selector comment.
  name: mcp-approval-gate-backend
  namespace: mcp-approval-gate
  labels:
    app: mcp-approval-gate
    component: backend
spec:
  # Single replica is REQUIRED with STORE_BACKEND=jsonl (RWO PVC, single-writer
  # store, in-memory replay cache). Recreate prevents two pods double-mounting
  # during a rollout. Scale out only after moving to DynamoDB + shared cache.
  # (The frontend has no such constraint — see frontend-deployment.yaml.)
  replicas: 1
  strategy:
    type: Recreate
  # Selector deliberately left as the bare `app` label rather than adding
  # `component: backend`: Deployment selectors are immutable, so changing it
  # would need a delete/recreate, and istio-authorizationpolicy.yaml's
  # NetworkPolicy grants access to the upstream aws-api-mcp-server based on
  # exactly this label. The backend is the only pod that may reach it — the
  # frontend uses its own label and is correctly excluded.
  selector:
    matchLabels:
      app: mcp-approval-gate
  template:
    metadata:
      labels:
        app: mcp-approval-gate
        component: backend
    spec:
      serviceAccountName: mcp-approval-gate-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: gate
          image: REGISTRY/mcp-approval-gate-backend:latest # set by CI
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mcp-approval-gate-backend
            - secretRef:
                name: mcp-approval-gate-backend
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcp-approval-gate-data
