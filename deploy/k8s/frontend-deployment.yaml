# SPA pod: nginx serving the built Vite bundle. Stateless — no PVC, no env,
# no secrets. Everything it needs to reach the API goes through the shared
# Gateway (see httproute.yaml), so it holds no configuration of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-approval-gate-frontend
  namespace: mcp-approval-gate
  labels:
    app: mcp-approval-gate-frontend
    component: frontend
spec:
  # Unlike the backend this has no single-writer constraint, so it can scale
  # out and roll rather than Recreate.
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mcp-approval-gate-frontend
  template:
    metadata:
      labels:
        app: mcp-approval-gate-frontend
        component: frontend
    spec:
      # No serviceAccountName: the SPA pod needs no AWS/IRSA identity, and
      # deliberately does not carry the backend's. Also excluded from the
      # upstream-MCP NetworkPolicy by virtue of its distinct app label.
      securityContext:
        runAsNonRoot: true
        # 101 is the nginx user in nginxinc/nginx-unprivileged.
        runAsUser: 101
      containers:
        - name: web
          image: REGISTRY/mcp-approval-gate-frontend:latest # set by CI
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
