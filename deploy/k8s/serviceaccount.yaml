apiVersion: v1
kind: ServiceAccount
metadata:
  # Renaming this changes the IRSA `sub` (system:serviceaccount:<ns>:<name>) --
  # the role's trust policy must be updated to match, or AssumeRoleWithWebIdentity
  # starts failing. It is also the principal named in
  # istio-authorizationpolicy.yaml, which is kept in sync.
  name: mcp-approval-gate-backend
  namespace: mcp-approval-gate
  annotations:
    # IRSA role for the gate itself. Needed permissions:
    #   - ses:SendEmail on the configured SES identity (notifications)
    #   - later: dynamodb:* (scoped) or s3:* (scoped) per chosen STORE_BACKEND
    # SigV4 agent verification needs NO permissions: the gate only forwards the
    # agent's own presigned sts:GetCallerIdentity request.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/mcp-approval-gate
