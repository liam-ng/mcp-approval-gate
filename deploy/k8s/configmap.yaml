apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-approval-gate
  namespace: mcp-approval-gate
data:
  ENV: "production"
  AUTH_MODE: "oidc"
  PUBLIC_BASE_URL: "https://approval-gate.internal.example.com"

  # --- Human OIDC (swap these to migrate IAM Identity Center -> Entra ID) ---
  OIDC_ISSUER: "https://identitycenter.amazonaws.com/ssoins-XXXXXXXX" # or https://login.microsoftonline.com/TENANT/v2.0
  OIDC_CLIENT_ID: "your-client-id"
  OIDC_SCOPES: "openid profile email"
  OIDC_GROUPS_CLAIM: "groups"
  OIDC_APPROVER_GROUPS: "aws-approvers,cloud-managers"
  # Fallback when the IdP emits no usable groups claim (IAM Identity Center):
  APPROVER_EMAILS: ""

  # --- Agent auth ---
  GATE_SERVER_ID: "mcp-approval-gate-prod"
  ALLOWED_AGENT_ARNS: "arn:aws:iam::ACCOUNT_ID:role/mcp-server-*"

  # --- Workflow ---
  REQUIRED_APPROVALS: "1" # or "2" for peer + manager
  APPROVAL_TTL_HOURS: "72"

  # --- Storage ---
  STORE_BACKEND: "jsonl"
  DATA_DIR: "/data"
  # DYNAMODB_TABLE: "mcp-approval-gate"
  # S3_BUCKET: "mcp-approval-gate-audit"     # Object Lock bucket
  # AUDIT_MIRROR_S3_BUCKET: ""

  # --- Notifications ---
  NOTIFY_ON_CREATE: "true"
  SES_FROM_ADDRESS: "approval-gate@example.com"
  SES_REGION: "ap-east-1"
