# Shares one SonarCloud project key with frontend/sonar-project.properties.
# Each workflow scans only its own projectBaseDir, so an analysis pushed under
# this key REPLACES the other component's findings — whichever workflow ran
# last is what the dashboard and the quality gate reflect. Give the two
# components distinct keys if per-component history ever matters.
sonar.projectKey=liam-ng_mcp-approval-gate
sonar.organization=liam-ng
sonar.projectName=MCP Approval Gate - Backend

# Paths are relative to projectBaseDir (= backend/). Dockerfile is in scope on
# purpose: its analyzer feeds the CWE gate.
sonar.sources=app,Dockerfile
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Both are gitignored but present after a local run — data/ holds the JSONL
# store's real tickets, and the egg-info tree is build metadata, not source.
sonar.exclusions=data/**,*.egg-info/**,**/__pycache__/**

# Without this the analyzer guesses the language level and version-specific
# rules misfire; matches pyproject.toml's requires-python.
sonar.python.version=3.14

# No sonar.python.coverage.reportPaths: pytest runs without coverage in CI, and
# pointing this at a missing report is a scanner error.

sonar.scm.provider=git
