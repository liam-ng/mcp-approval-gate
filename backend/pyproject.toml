[project]
name = "mcp-approval-gate"
version = "0.1.0"
description = "Blocking approval gate adding auditability and traceability to AWS changes made by an AI agent (MCP server)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }
