[project]
name = "mcp-approval-gate"
version = "0.1.0"
description = "Blocking approval gate adding auditability and traceability to AWS changes made by an AI agent (MCP server)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "boto3>=1.34",
    "python-ulid>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
