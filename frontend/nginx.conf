# SPA server for the frontend pod.
#
# Port 8080, not 80: the image is nginxinc/nginx-unprivileged so the whole
# pod can keep runAsNonRoot/runAsUser 1001, matching the backend's pod
# security context. Binding :80 would need CAP_NET_BIND_SERVICE or root.
#
# This deliberately does NOT proxy /api|/mcp|/.well-known to the backend --
# the ingress splits those by path (deploy/k8s/ingress.yaml). Keeping the
# routing in one place avoids two sources of truth, and because both pods sit
# behind the same host, the browser still sees a single origin: the session
# cookie keeps working and no CORS config is needed anywhere.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints asset filenames (index-<hash>.js), so they're safe to
    # cache forever -- a rebuild produces a new name rather than new content
    # at the same URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it's the only file whose URL is stable
    # across deploys, so a cached copy would keep pointing at deleted asset
    # hashes after a rollout.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routes (/tickets/:id, /act, /login) have no file on disk --
    # hand them index.html and let react-router resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
