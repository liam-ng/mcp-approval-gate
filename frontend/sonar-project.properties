# Scanned as its own Sonar project, separate from the backend — a shared key
# would let whichever workflow ran last overwrite the other's results.
sonar.projectKey=mcp-approval-gate-frontend
sonar.projectName=MCP Approval Gate - Frontend

# Paths are relative to projectBaseDir (= frontend/). Dockerfile is in scope on
# purpose: its analyzer feeds the CWE gate. nginx.conf has no analyzer.
sonar.sources=src,Dockerfile
sonar.sourceEncoding=UTF-8

# dist is gitignored but present after `npm run build` — without this a local
# scan analyzes the minified bundle.
sonar.exclusions=dist/**,node_modules/**

# Without this the TS analyzer falls back to untyped parsing and the taint
# rules never fire.
sonar.typescript.tsconfigPaths=tsconfig.json

# No sonar.tests/coverage: no test runner in package.json yet, and pointing
# sonar.tests at a missing directory is a scanner error.

sonar.scm.provider=git

# SonarCloud only; self-hosted SonarQube ignores it.
# sonar.organization=your-org