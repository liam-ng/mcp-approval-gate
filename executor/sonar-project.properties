# Shares one SonarCloud project key with backend/ and frontend/
# sonar-project.properties. Each workflow scans only its own projectBaseDir, so
# an analysis pushed under this key REPLACES the other component's findings —
# whichever workflow ran last is what the dashboard and the quality gate
# reflect. Give the three components distinct keys if per-component history
# ever matters.
sonar.projectKey=liam-ng_mcp-approval-gate
sonar.organization=liam-ng
sonar.projectName=MCP Approval Gate - Executor

# Paths are relative to projectBaseDir (= executor/). Dockerfile is in scope on
# purpose: its analyzer feeds the CWE gate.
sonar.sources=app,Dockerfile
sonar.sourceEncoding=UTF-8

# __pycache__ can appear after a local import check (pipelines/executor/ci.sh
# test); it is not source.
sonar.exclusions=**/__pycache__/**

# Without this the analyzer guesses the language level and version-specific
# rules misfire; matches executor/Dockerfile's python:3.14 base.
sonar.python.version=3.14

# No sonar.tests / coverage: the executor has no test suite yet (CI only does
# an import + settings check), and pointing sonar.tests at a missing directory
# is a scanner error.

sonar.scm.provider=git
