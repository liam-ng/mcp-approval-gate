name: Executor

# Path filters keep the three components independent: a backend-only change
# never rebuilds or republishes the executor image.
on:
  push:
    branches: [main]
    paths:
      - "executor/**"
      - "pipelines/executor/**"
      - "pipelines/lib.sh"
      - ".github/workflows/executor.yml"
  pull_request:
    branches: [main]
    paths:
      - "executor/**"
      - "pipelines/executor/**"
      - "pipelines/lib.sh"
      - ".github/workflows/executor.yml"
  workflow_dispatch:

jobs:
  # Fails on missing required secrets
  verify-configs:
    name: Verify secrets and config
    runs-on: ubuntu-latest
    environment: liam-dev
    outputs:
      sonar: ${{ steps.cfg.outputs.sonar }}
    steps:
      - id: cfg
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          MANIFEST_REPO_PR_TOKEN: ${{ secrets.MANIFEST_REPO_PR_TOKEN }}
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        # require() Hard and note() Soft gate functions are used to check if the required secrets are configured
        # 2 stages for Required and Optional secrets
        run: |
          missing=0
          require() {
            if [ -z "${!1:-}" ]; then
              echo "::error::Required secret $1 is not configured — $2"
              echo "- ❌ \`$1\` is not configured — $2" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            else
              echo "  ok       $1"
            fi
          }
          note() {
            if [ -n "${!1:-}" ]; then
              echo "  ok       $1"
            else
              echo "::warning::$1 not set — $2"
              echo "- ⚠️ \`$1\` not set — $2" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }

          echo "--------------------------------"
          echo "Required Secrets:"
          echo "--------------------------------"
          require REGISTRY_ENDPOINT "liam-dev environment secret; the ACR login server the image ref is built from"
          require AZURE_CLIENT_ID "azure/login OIDC federation, needed to push to ACR"
          require AZURE_TENANT_ID "azure/login OIDC federation, needed to push to ACR"
          require AZURE_SUBSCRIPTION_ID "azure/login OIDC federation, needed to push to ACR"

          # Fine-grained PAT token at liam-ng/liam-dev-k8s-argoCD
          note MANIFEST_REPO_PR_TOKEN "PAT for liam-dev-k8s-argoCD (push + open PR); without it the image publishes but nothing proposes the tag bump, so Argo never sees it" || true

          echo "--------------------------------"
          echo "Optional Secrets:"
          echo "--------------------------------"
          # note()'s exit status drives the output the sonarqube job gates on —
          # an output that is never written reads as '' and would skip sonarqube
          # silently, so both branches write it explicitly.
          if note SONAR_TOKEN "skipping SonarQube scan"; then
            echo "sonar=true" >> "$GITHUB_OUTPUT"
          else
            echo "sonar=false" >> "$GITHUB_OUTPUT"
          fi
          note SONAR_HOST_URL "SonarCloud assumed" || true

          [ "$missing" -eq 0 ] || { echo "::error::Configure the missing secrets in the liam-dev environment or at repo level, then re-run."; exit 1; }

  test:
    name: Import + settings check
    runs-on: ubuntu-latest
    defaults:
      run:
        # Import check must run from executor/ so `app.*` resolves; settings.py
        # validates at import, so this is the CrashLoop class CI can catch.
        working-directory: executor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: executor/requirements.txt
      - run: | #./pipelines/executor/ci.sh test
          python -m pip install --quiet -r requirements.txt
          GATE_SERVER_ID=ci-import-check python -c "
          import app.main, app.aws_exec, app.gate_client
          from app.settings import settings
          assert settings.dry_run is True, 'DRY_RUN must default to on'
          assert settings.poll_interval_seconds > 0
          print('executor imports clean; dry_run default is on')
          "
      # The import check above cannot catch a wrong VALUE, only a broken import. Both 2026-08-13
      # executor faults were values -- a signature that repeated within one second, and a report
      # that raised instead of retrying -- so these are unit tests, not another smoke check.
      - run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest tests -q

  # Hard gate: SonarQube scan is required to pass before the image is built
  # Configure quality gate on SonarCloud to control pass/fail criteria
  sonarqube:
    name: SonarQube SAST (CWE gate)
    runs-on: ubuntu-latest
    needs: verify-configs
    if: needs['verify-configs'].outputs.sonar == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for Sonar blame/new-code
      - id: cfg
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.enabled != 'true'
        run: echo "::warning::SONAR_TOKEN not set — skipping SonarQube scan."
      - if: steps.cfg.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          projectBaseDir: executor
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # omit for SonarCloud

      - if: steps.cfg.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        # The scan writes report-task.txt under projectBaseDir, not the workspace root
        with:
          scanMetadataReportFile: executor/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Display link to SonarCloud full report
      - name: Link SonarQube dashboard in summary
        if: always() && steps.cfg.outputs.enabled == 'true'
        run: |
          {
            echo "### SonarQube — executor"
            echo "[View analysis on SonarCloud](https://sonarcloud.io/summary/new_code?id=liam-ng_mcp-approval-gate&branch=main)"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build, scan, smoke, push
    runs-on: ubuntu-latest
    needs: [verify-configs, test, sonarqube]
    # `always()` lets this run when sonarqube was skipped for a missing token;
    if: >-
      always()
      && needs['verify-configs'].result == 'success'
      && needs.test.result == 'success'
      && (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
    environment: liam-dev
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ steps.ref.outputs.image_tag }}
    env:
      # ACR login server
      REGISTRY: ${{ secrets.REGISTRY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image ref
        id: ref
        run: |
          tag="$(git rev-parse --short HEAD)"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${REGISTRY}/mcp-approval-gate-executor:${tag}" >> "$GITHUB_ENV"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          # Context is ./executor; Reference to the Dockerfile;
          context: ./executor
          load: true # into the local daemon — scan and smoke both need it there
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha,scope=executor
          cache-to: type=gha,mode=max,scope=executor

      # Reports everything the gate below does NOT fail on: HIGH severity, and
      # CRITICALs with no fix yet. Runs first and never fails, so the report
      # exists even when the gate stops the run.
      - name: Output Trivy report and upload as artifact
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
          output: trivy-executor.txt

      # Same scan in Trivy's native JSON — the table is for humans, this is what
      # downstream tooling can parse. skip-setup-trivy reuses the binary and DB
      # the step above already fetched.
      - name: Output Trivy report as JSON
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: json
          output: trivy-executor.json
          skip-setup-trivy: true

      - name: Publish Trivy report in summary
        run: |
          {
            echo "### Trivy — executor \`${IMAGE_TAG}\`"
            echo '```'
            head -c 900000 trivy-executor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: trivy-executor-${{ env.IMAGE_TAG }}
          path: |
            trivy-executor.txt
            trivy-executor.json

      # Hard gate: exit-code 1 fails before any push. ignore-unfixed is
      # deliberate — an unfixable base-image CVE can't be actioned here.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      # Reference to cmd_smoke()
      # boot against an unreachable gate; assert the startup line, that DRY_RUN
      # defaults on, that a transient poll failure does not kill the process,
      # UID 1001, and that bad config refuses to start at all.
      - run: ./pipelines/executor/ci.sh smoke

      # PRs build, scan and smoke test but never publish.
      - name: Azure login (OIDC federated)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login server is {name}-{suffix}.azurecr.io. --suffix is required when
      # the identity can push images but cannot read the ACR ARM resource
      # (az would otherwise fall back to name.azurecr.io and fail).
      - name: ACR login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          host="${REGISTRY%.azurecr.io}"
          az acr login --name "${host%%-*}" --suffix "${host#*-}"

      # Re-runs the Build step's action with push instead of load. Every layer is a cache hit from that step
      - name: Push Image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./executor
          push: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.REGISTRY }}/mcp-approval-gate-executor:main
          cache-from: type=gha,scope=executor

  # ---------------------------------------------------------------------------
  # Push a PR to liam-ng/liam-dev-k8s-argoCD repo for image tag bump
  # verify-and-rollback.yml triggered by OWN push to main to chain a followup job
  # Note: executor is headless, so the health probe there checks backend/frontend only.

  delivery:
    name: Deliver executor image tag to the manifest repo (PR)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: liam-dev
    permissions:
      contents: read
    steps:
      - name: Checkout the manifest repo
        uses: actions/checkout@v7
        with:
          repository: liam-ng/liam-dev-k8s-argoCD
          # Fine-grained PAT to open PR
          token: ${{ secrets.MANIFEST_REPO_PR_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Install kustomize
        run: |
          # Version Pin. Prevents kustomize rewrites for consistent Argo output
          version=5.7.1
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${version}/kustomize_v${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Branch, set the image tag, commit
        id: commit
        working-directory: apps/mcp-approval-gate/overlays/liam-dev
        env:
          TAG: ${{ needs.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branch name is unique per component+tag,
          # Prevents backend/frontend/executor racing on one push preventing merge conflict
          branch="bump-executor-${TAG}"
          git switch -c "$branch"

          kustomize edit set image \
            "mcp-approval-gate-executor=${{ secrets.REGISTRY_ENDPOINT }}/mcp-approval-gate-executor:${TAG}"

          # Prevent a no-op PR when the manifest already references this image tag.
          if git diff --quiet; then
            echo "image already at ${TAG}; nothing to propose"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -am "executor: ${TAG} (from ${GITHUB_REPOSITORY}@${GITHUB_SHA})"
          # Re-running workflow reuses the same branch name -- force-push is required for stale/abandoned attempt instead of failing on a name collision.
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Open the PR
        if: steps.commit.outputs.branch != ''
        working-directory: apps/mcp-approval-gate
        env:
          # Same PAT as the checkout step above -- gh reads GH_TOKEN directly, no separate `gh auth login` needed.
          GH_TOKEN: ${{ secrets.MANIFEST_REPO_PR_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TAG: ${{ needs.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          # Skip if a retry finds a PR already open for this branch
          existing_pr="$(gh pr list --repo liam-ng/liam-dev-k8s-argoCD --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing_pr" ]]; then
            echo "PR #${existing_pr} already exists"
            exit 0
          fi

          gh pr create \
            --repo liam-ng/liam-dev-k8s-argoCD \
            --base main \
            --head "$BRANCH" \
            --title "executor: bump image to ${TAG}" \
            --body "Opened by mcp-approval-gate CI from ${GITHUB_REPOSITORY}@${GITHUB_SHA}.

          Merging for Argo CD deploy it -- selfHeal + auto-sync picks up the changes
          verify-and-rollback.yml probes the new pod and opens a revert PR if not healthy."
