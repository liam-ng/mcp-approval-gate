name: Backend

# Path filters keep the two components independent: a frontend-only change
# never rebuilds or republishes the backend image.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pipelines/backend/**"
      - "pipelines/lib.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "pipelines/backend/**"
      - "pipelines/lib.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  # Fails on missing required secrets
  verify-configs:
    name: Verify secrets and config
    runs-on: ubuntu-latest
    environment: liam-dev
    outputs:
      sonar: ${{ steps.cfg.outputs.sonar }}
    steps:
      - id: cfg
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DEPLOY_REPO_SSH_KEY: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          MANIFEST_REPO_PR_TOKEN: ${{ secrets.MANIFEST_REPO_PR_TOKEN }}
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

        # require() Hard and note() Soft gate functions are used to check if the required secrets are configured
        # 2 stages for Required and Optional secrets
        run: |
          missing=0
          require() {
            if [ -z "${!1:-}" ]; then
              echo "::error::Required secret $1 is not configured — $2"
              echo "- ❌ \`$1\` is not configured — $2" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            else
              echo "  ok       $1"
            fi
          }
          note() {
            if [ -n "${!1:-}" ]; then
              echo "  ok       $1"
            else
              echo "::warning::$1 not set — $2"
              echo "- ⚠️ \`$1\` not set — $2" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }

          echo "--------------------------------"
          echo "Required Secrets:"
          echo "--------------------------------"
          require REGISTRY_ENDPOINT "liam-dev environment secret; the ACR login server the image ref is built from"
          require AZURE_CLIENT_ID "azure/login OIDC federation, needed to push to ACR"
          require AZURE_TENANT_ID "azure/login OIDC federation, needed to push to ACR"
          require AZURE_SUBSCRIPTION_ID "azure/login OIDC federation, needed to push to ACR"

          # Soft, not hard, on purpose: without it the pipeline still builds,
          # scans and publishes the image correctly -- only the manifest-repo
          # bump is skipped, so the image exists but nothing deploys it. Making
          # it required would fail every PR too, which it has no part in.
          note DEPLOY_REPO_SSH_KEY "write deploy key for liam-dev-k8s-argoCD; without it the image publishes but the deploy job cannot push the bump branch, so no PR gets opened" || true
          # Fine-grained PAT or GitHub App installation token, NOT a classic PAT --
          # scoped to pull-requests:write + contents:read on liam-dev-k8s-argoCD only.
          # Separate credential from the SSH key above: that one authenticates git
          # (push the branch), this one authenticates the GitHub API (open the PR) --
          # `gh pr create` needs its own token regardless of how the branch got there.
          note MANIFEST_REPO_PR_TOKEN "PR-open token for liam-dev-k8s-argoCD; without it the branch pushes but no PR gets opened, so a human has to open it by hand" || true

          echo "--------------------------------"
          echo "Optional Secrets:"
          echo "--------------------------------"
          # note()'s exit status drives the output the sonarqube job gates on —
          # an output that is never written reads as '' and would skip sonarqube
          # silently, so both branches write it explicitly.
          if note SONAR_TOKEN "skipping SonarQube scan"; then
            echo "sonar=true" >> "$GITHUB_OUTPUT"
          else
            echo "sonar=false" >> "$GITHUB_OUTPUT"
          fi
          note SONAR_HOST_URL "SonarCloud assumed" || true

          [ "$missing" -eq 0 ] || { echo "::error::Configure the missing secrets in the liam-dev environment or at repo level, then re-run."; exit 1; }

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        # pytest MUST run from backend/ — pyproject.toml sets asyncio_mode="auto"
        # there, so from the repo root every async test fails.
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          # Both files: requirements.txt holds the runtime deps, the [dev]
          # extras installed below are declared in pyproject itself.
          cache-dependency-path: |
            backend/requirements.txt
            backend/pyproject.toml
      - run: | #./pipelines/backend/ci.sh test
          python -m pip install --quiet -e ".[dev]"
          python -m pytest -q

  # Hard gate: SonarQube scan is required to pass before the image is built
  # Configure quality gate on SonarCloud to control pass/fail criteria
  sonarqube:
    name: SonarQube SAST (CWE gate)
    runs-on: ubuntu-latest
    needs: verify-configs
    if: needs['verify-configs'].outputs.sonar == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for Sonar blame/new-code

      - id: cfg
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.cfg.outputs.enabled != 'true'
        run: echo "::warning::SONAR_TOKEN not set — skipping SonarQube scan."

      - if: steps.cfg.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # omit for SonarCloud

      - if: steps.cfg.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        # The scan writes report-task.txt under projectBaseDir, not the workspace root
        with:
          scanMetadataReportFile: backend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # SonarCloud already hosts the full report — link to it rather than
      # duplicating it here. always() so the link is present on the runs that
      # matter most: the ones where the gate above failed.
      - name: Link SonarQube dashboard in summary
        if: always() && steps.cfg.outputs.enabled == 'true'
        run: |
          {
            echo "### SonarQube — backend"
            echo "[View analysis on SonarCloud](https://sonarcloud.io/summary/new_code?id=liam-ng_mcp-approval-gate&branch=main)"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build, DAST scan, smoke, push
    runs-on: ubuntu-latest
    needs: [verify-configs, test, sonarqube]
    # `always()` lets this run when sonarqube was skipped for a missing token;
    if: >-
      always()
      && needs['verify-configs'].result == 'success'
      && needs.test.result == 'success'
      && (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')
    environment: liam-dev
    permissions:
      id-token: write
      contents: read
    outputs:
      # The immutable per-sha tag this run published. The deploy job cannot
      # recompute it: it checks out the MANIFEST repo, so `git rev-parse HEAD`
      # there is a different commit entirely.
      image_tag: ${{ steps.ref.outputs.image_tag }}
    env:
      # Full ACR login server FQDN (name-<suffix>.azurecr.io). Image tags use
      # this host; az acr login uses --name/--suffix parsed from it.
      REGISTRY: ${{ secrets.REGISTRY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image ref
        id: ref
        run: |
          tag="$(git rev-parse --short HEAD)"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${REGISTRY}/mcp-approval-gate-backend:${tag}" >> "$GITHUB_ENV"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          # Context is ./backend; Reference to the Dockerfile;
          context: ./backend
          load: true # into the local daemon — scan and smoke both need it there
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Reports everything the gate below does NOT fail on: HIGH severity, and
      # CRITICALs with no fix yet. Runs first and never fails, so the report
      # exists even when the gate stops the run.
      - name: Output Trivy report and upload as artifact
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
          output: trivy-backend.txt

      # Same scan in Trivy's native JSON — the table is for humans, this is what
      # downstream tooling can parse. skip-setup-trivy reuses the binary and DB
      # the step above already fetched.
      - name: Output Trivy report as JSON
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: json
          output: trivy-backend.json
          skip-setup-trivy: true

      - name: Publish Trivy report in summary
        run: |
          {
            echo "### Trivy — backend \`${IMAGE_TAG}\`"
            echo '```'
            head -c 900000 trivy-backend.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: trivy-backend-${{ env.IMAGE_TAG }}
          path: |
            trivy-backend.txt
            trivy-backend.json

      # Hard gate: exit-code 1 fails before any push. ignore-unfixed is
      # deliberate — an unfixable base-image CVE can't be actioned here.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

      # Reference to cmd_smoke()
      # start container, poll readiness; check /api/healthz body; assert GET / is 404 so a leaked static/ can't fight httproute.yaml for routing; assert UID 1001;
      - run: ./pipelines/backend/ci.sh smoke

      # PRs build, scan and smoke test but never publish.
      - name: Azure login (OIDC federated)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login server is {name}-{suffix}.azurecr.io. --suffix is required when
      # the identity can push images but cannot read the ACR ARM resource
      # (az would otherwise fall back to name.azurecr.io and fail).
      - name: ACR login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          host="${REGISTRY%.azurecr.io}"
          az acr login --name "${host%%-*}" --suffix "${host#*-}"

      # Re-runs the Build step's action with push instead of load. Every layer is a cache hit from that step
      - name: Push Image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_REF }}
            ${{ env.REGISTRY }}/mcp-approval-gate-backend:main
          cache-from: type=gha,scope=backend

  # ---------------------------------------------------------------------------
  # Close the GitOps loop. Argo CD does not watch registries, so pushing an
  # image is not a deployment -- landing its tag in the manifest repo's main is
  # what makes a merge actually roll out. This job PROPOSES that via a PR
  # rather than pushing straight to main -- see the PR's own description for
  # why. Health-check-and-revert-on-failure now lives entirely in the manifest
  # repo (verify-and-rollback.yml there), triggered by ITS OWN push to main,
  # because a PR merge can happen minutes or days after this job runs -- there
  # is no "immediately after" moment in this workflow to chain a followup job
  # onto anymore.
  deploy:
    name: Open a backend image-bump PR against the manifest repo
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: liam-dev
    permissions:
      contents: read
    steps:
      - name: Checkout the manifest repo
        uses: actions/checkout@v7
        with:
          repository: liam-ng/liam-dev-k8s-argoCD
          # Deploy key with WRITE access -- a different key from the read-only
          # one Argo CD reads this repo with. Using ssh-key (not token) also
          # points the remote at git@github.com, which is what that key serves.
          # Still needed even though this job no longer pushes to main: opening
          # a PR still means pushing the proposal BRANCH somewhere, and this key
          # is what's authorized to do that. See the PR description below for
          # why this can't be narrowed away by the PR-flow change alone.
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}
          ref: main
          fetch-depth: 0

      - name: Install kustomize
        run: |
          # Pinned. `kustomize edit set image` rewrites a file Argo reconciles,
          # so the tool that writes it should not float.
          version=5.7.1
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${version}/kustomize_v${version}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Branch, set the image tag, commit
        id: commit
        working-directory: apps/mcp-approval-gate/overlays/liam-dev
        env:
          TAG: ${{ needs.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Branch name is unique per component+tag, so backend/frontend/executor
          # firing together no longer race on one shared branch/push the way the
          # old direct-push flow did -- each opens its own PR against the same
          # file, and any resulting merge conflict is an ordinary PR-review
          # concern for whoever merges second, not something CI needs to retry.
          branch="bump-backend-${TAG}"
          git switch -c "$branch"

          kustomize edit set image \
            "mcp-approval-gate-backend=${{ secrets.REGISTRY_ENDPOINT }}/mcp-approval-gate-backend:${TAG}"

          # Re-running a workflow on an unchanged sha is a no-op, not a failure.
          if git diff --quiet; then
            echo "image already at ${TAG}; nothing to propose"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -am "backend: ${TAG} (from ${GITHUB_REPOSITORY}@${GITHUB_SHA})"
          # Re-running this workflow (e.g. workflow_dispatch retry) on the same
          # sha reuses the same branch name -- force-push so the retry replaces
          # a stale/abandoned attempt instead of failing on a name collision.
          git push --force origin "HEAD:refs/heads/${branch}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Open the PR
        if: steps.commit.outputs.branch != ''
        working-directory: apps/mcp-approval-gate
        env:
          # Separate from DEPLOY_REPO_SSH_KEY on purpose: the SSH key only ever
          # touches git (clone/push over SSH); gh talks to the GitHub API over
          # HTTPS and needs its own token. Scope this one narrowly --
          # `pull-requests: write` + `contents: read` on liam-dev-k8s-argoCD
          # only, nothing else -- since unlike the SSH key it CAN be scoped
          # that tightly (a fine-grained PAT or GitHub App installation token,
          # not a classic PAT).
          GH_TOKEN: ${{ secrets.MANIFEST_REPO_PR_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TAG: ${{ needs.image.outputs.image_tag }}
        run: |
          set -euo pipefail
          gh pr create \
            --repo liam-ng/liam-dev-k8s-argoCD \
            --base main \
            --head "$BRANCH" \
            --title "backend: bump image to ${TAG}" \
            --body "Opened by mcp-approval-gate CI from ${GITHUB_REPOSITORY}@${GITHUB_SHA}.

          Merging this is what makes Argo CD deploy it -- selfHeal + auto-sync
          picks up the merge commit on main same as any other change here.
          verify-and-rollback.yml in this repo watches for that and opens a
          revert PR on its own if the new pod never comes up healthy."
