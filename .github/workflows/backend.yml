# Thin orchestration only — the logic lives in pipelines/backend/ci.sh so it
# runs locally and isn't locked into this CI system. GitHub Actions can only
# execute workflows from .github/workflows/, which is why this file isn't in
# pipelines/ alongside the script it calls.
name: Backend

# Path filters keep the two components independent: a frontend-only change
# never rebuilds or republishes the backend image. Duplicated rather than
# shared via a YAML anchor because GitHub Actions does not support anchors.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pipelines/backend/**"
      - "pipelines/lib.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "pipelines/backend/**"
      - "pipelines/lib.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

env:
  REGISTRY: liammcp-fxb8azcnexhncbd9.azurecr.io

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: ./pipelines/backend/ci.sh test

  sonar:
    name: SonarQube SAST (CWE gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for Sonar blame/new-code
      - id: cfg
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.enabled != 'true'
        run: echo "::warning::SONAR_TOKEN not set — skipping SonarQube scan."
      - if: steps.cfg.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # omit for SonarCloud
      # Hard gate — Blocker/Critical CWE issues -> fail
      - if: steps.cfg.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Build, DAST scan, smoke, push
    runs-on: ubuntu-latest
    needs: [test, sonar]
    permissions:
      # Required for azure/login's OIDC federation
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: ./pipelines/backend/ci.sh build
      - uses: aquasecurity/setup-trivy@v0.2.0
      - run: ./pipelines/backend/ci.sh scan
      - run: ./pipelines/backend/ci.sh smoke

      # PRs build, scan and smoke test but never publish.
      - name: Azure login (OIDC federated)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "${REGISTRY%%.*}"
        
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MOVING_TAG: main
        run: ./pipelines/backend/ci.sh push
