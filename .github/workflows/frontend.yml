# Thin orchestration only — the logic lives in pipelines/frontend/ci.sh so it
# runs locally and isn't locked into this CI system. GitHub Actions can only
# execute workflows from .github/workflows/, which is why this file isn't in
# pipelines/ alongside the script it calls.
name: Frontend

# Path filters keep the two components independent: a backend-only change
# never rebuilds or republishes the frontend image. Duplicated rather than
# shared via a YAML anchor because GitHub Actions does not support anchors.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "pipelines/frontend/**"
      - "pipelines/lib.sh"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "pipelines/frontend/**"
      - "pipelines/lib.sh"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

env:
  REGISTRY: liammcp-fxb8azcnexhncbd9.azurecr.io

jobs:
  test:
    name: Type check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./pipelines/frontend/ci.sh test

  sonar:
    name: SonarQube (CWE gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for blame/new-code
      # `secrets` isn't available in a job-level `if`, so gate on a step output
      # instead: without SONAR_TOKEN this no-ops rather than failing.
      - id: cfg
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.cfg.outputs.enabled != 'true'
        run: echo "::warning::SONAR_TOKEN not set — skipping SonarQube scan."
      - if: steps.cfg.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # omit for SonarCloud
      - if: steps.cfg.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Build, scan, smoke, push
    runs-on: ubuntu-latest
    needs: [test, sonar]
    permissions:
      # OIDC federation replaces a stored service-principal secret.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: ./pipelines/frontend/ci.sh build
      - uses: aquasecurity/setup-trivy@v0.2.0
      - run: ./pipelines/frontend/ci.sh scan
      - run: ./pipelines/frontend/ci.sh smoke

      # PRs build, scan and smoke test but never publish.
      - name: Azure login (OIDC, no stored secret)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "${REGISTRY%%.*}"
      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MOVING_TAG: main
        run: ./pipelines/frontend/ci.sh push
