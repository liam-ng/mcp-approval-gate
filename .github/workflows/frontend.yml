name: Frontend

# Path filters keep the two components independent: a backend-only change
# never rebuilds or republishes the frontend image.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "pipelines/frontend/**"
      - "pipelines/lib.sh"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "pipelines/frontend/**"
      - "pipelines/lib.sh"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

jobs:
  # Fails on missing required secrets
  verify-configs:
    name: Verify secrets and config
    runs-on: ubuntu-latest
    environment: liam-dev
    outputs:
      sonar: ${{ steps.cfg.outputs.sonar }}
    steps:
      - id: cfg
        env:
          REGISTRY_ENDPOINT: ${{ secrets.REGISTRY_ENDPOINT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

          # require() Hard and note() Soft gate functions are used to check if the required secrets are configured
          # 2 stages for Required and Optional secrets
        run: |
          missing=0
          require() {
            if [ -z "${!1:-}" ]; then
              echo "::error::Required secret $1 is not configured — $2"
              echo "- ❌ \`$1\` is not configured — $2" >> "$GITHUB_STEP_SUMMARY"
              missing=1
            else
              echo "  ok       $1"
            fi
          }
          note() {
            if [ -n "${!1:-}" ]; then
              echo "  ok       $1"
            else
              echo "::warning::$1 not set — $2"
              echo "- ⚠️ \`$1\` not set — $2" >> "$GITHUB_STEP_SUMMARY"
              return 1
            fi
          }

          echo "--------------------------------"
          echo "Required Secrets:"
          echo "--------------------------------"
          require REGISTRY_ENDPOINT "liam-dev environment secret; the image tag is built from it"
          require AZURE_CLIENT_ID "azure/login OIDC federation, needed to push to ACR"
          require AZURE_TENANT_ID "azure/login OIDC federation, needed to push to ACR"
          require AZURE_SUBSCRIPTION_ID "azure/login OIDC federation, needed to push to ACR"

          echo "--------------------------------"
          echo "Optional Secrets:"
          echo "--------------------------------"
          if note SONAR_TOKEN "skipping SonarQube scan"; then
            echo "sonar=true" >> "$GITHUB_OUTPUT"
          else
            echo "sonar=false" >> "$GITHUB_OUTPUT"
          fi
          note SONAR_HOST_URL "SonarCloud assumed" || true

          [ "$missing" -eq 0 ] || { echo "::error::Configure the missing secrets in the liam-dev environment or at repo level, then re-run."; exit 1; }

  test:
    name: Type check + build test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: | #./pipelines/frontend/ci.sh test
          npm ci --no-audit --no-fund
          npm run build

  # Hard gate: SonarQube scan is required to pass before the image is built
  # Configure quality gate on SonarCloud to control pass/fail criteria
  sonar:
    name: SonarQube (CWE gate)
    runs-on: ubuntu-latest
    needs: verify-configs
    if: needs['verify-configs'].outputs.sonar == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for blame/new-code
      - uses: SonarSource/sonarqube-scan-action@v4
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # omit for SonarCloud
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Build, scan, smoke, push
    runs-on: ubuntu-latest
    needs: [verify-configs, test, sonar]
    # `always()` lets this run when sonar was skipped for a missing token;
    if: >-
      always()
      && needs['verify-configs'].result == 'success'
      && needs.test.result == 'success'
      && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    environment: liam-dev
    permissions:
      id-token: write
      contents: read
    env:
      REGISTRY: ${{ secrets.REGISTRY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image ref
        run: |
          tag="$(git rev-parse --short HEAD)"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${REGISTRY}/mcp-approval-gate-frontend:${tag}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          # Context is ./frontend; Reference to the Dockerfile;
          context: ./frontend
          load: true # into the local daemon — scan and smoke both need it there
          tags: ${{ env.IMAGE_REF }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Hard gate: exit-code 1 fails before any push. ignore-unfixed is
      # deliberate — an unfixable base-image CVE can't be actioned here.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Reference to cmd_smoke()
      # start container, poll readiness; check /api/healthz body; assert GET / is 404 so other static/ routes can't leak in; assert UID 101;
      - run: ./pipelines/frontend/ci.sh smoke

      # PRs build, scan and smoke test but never publish.
      - name: Azure login (OIDC, no stored secret)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: az acr login --name "${REGISTRY%%.*}"

      - name: Push Image to ACR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          MOVING_TAG: main
        run: ./pipelines/frontend/ci.sh push
